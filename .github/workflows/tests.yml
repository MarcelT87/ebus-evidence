name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        run: pytest -q


  package-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2'
          python -m build
          test "$(find dist -maxdepth 1 -type f -name '*.whl' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.tar.gz' | wc -l)" -eq 1

      - name: Install built wheel in a clean environment
        run: |
          expected_version="$(python - <<'PY'
          import tomllib
          with open("pyproject.toml", "rb") as handle:
              print(tomllib.load(handle)["project"]["version"])
          PY
          )"

          python -m venv /tmp/ebus-evidence-package-smoke
          /tmp/ebus-evidence-package-smoke/bin/python -m pip install --upgrade pip
          /tmp/ebus-evidence-package-smoke/bin/python -m pip install dist/*.whl

          cd /tmp

          installed_version="$(
            /tmp/ebus-evidence-package-smoke/bin/python - <<'PY'
          from importlib.metadata import version
          print(version("ebus-evidence"))
          PY
          )"
          test "$installed_version" = "$expected_version"

          runtime_version="$(
            /tmp/ebus-evidence-package-smoke/bin/ebus-evidence --version
          )"
          test "$runtime_version" = "$expected_version"

          /tmp/ebus-evidence-package-smoke/bin/ebus-evidence --help >/dev/null

          /tmp/ebus-evidence-package-smoke/bin/python - <<'PY'
          from ebus_evidence.profiles.loader import load_profile

          profile = load_profile("hw5103-open-evidence")
          assert profile["name"] == "hw5103-open-evidence"
          assert profile["version"] == 2
          assert {check["id"] for check in profile["checks"]} == {
              "hmu_a80e_nonzero",
              "hmu_ba08_variants",
              "vwzio_3538_variants",
              "vwzio_b512_states",
          }
          PY


  contributor-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Create a separate fresh contributor checkout
        run: |
          git clone --no-local "$GITHUB_WORKSPACE" /tmp/ebus-evidence-contributor
          cd /tmp/ebus-evidence-contributor
          test -z "$(git status --porcelain)"
          test ! -e .venv
          test ! -e data
          test ! -e evidence

      - name: Install from the fresh checkout
        working-directory: /tmp/ebus-evidence-contributor
        run: |
          bash install.sh
          ./evidence --version
          ./evidence --help >/dev/null

      - name: Run the public static-import workflow
        working-directory: /tmp/ebus-evidence-contributor
        run: |
          cp tests/fixtures/sample.raw /tmp/contributor-ebusd.raw
          sha256sum /tmp/contributor-ebusd.raw > /tmp/contributor-ebusd.sha256

          ./evidence doctor             --raw /tmp/contributor-ebusd.raw             --profile hw5103-open-evidence

          ./evidence import             --raw /tmp/contributor-ebusd.raw

          sha256sum -c /tmp/contributor-ebusd.sha256

          ./evidence status             --raw /tmp/contributor-ebusd.raw

          ./evidence export

          ./evidence verify data/evidence.zip
          ./evidence verify --submission data/evidence.zip

          test -f data/evidence-state.json
          test -f data/evidence.zip

      - name: Missing raw input fails cleanly
        working-directory: /tmp/ebus-evidence-contributor
        run: |
          if ./evidence doctor             --raw /tmp/does-not-exist-ebusd.raw             --profile hw5103-open-evidence             > /tmp/contributor-missing-raw.log 2>&1; then
            cat /tmp/contributor-missing-raw.log
            echo "doctor unexpectedly accepted a missing raw log" >&2
            exit 1
          fi
          cat /tmp/contributor-missing-raw.log
          if grep -F "Traceback (most recent call last)" /tmp/contributor-missing-raw.log; then
            echo "missing raw input leaked a Python traceback" >&2
            exit 1
          fi

      - name: Invalid bundle fails cleanly
        working-directory: /tmp/ebus-evidence-contributor
        run: |
          printf 'not a zip\n' > /tmp/not-an-evidence-bundle.zip
          if ./evidence verify /tmp/not-an-evidence-bundle.zip             > /tmp/contributor-invalid-bundle.log 2>&1; then
            cat /tmp/contributor-invalid-bundle.log
            echo "verify unexpectedly accepted an invalid ZIP" >&2
            exit 1
          fi
          cat /tmp/contributor-invalid-bundle.log
          grep -F "INVALID:" /tmp/contributor-invalid-bundle.log
          if grep -F "Traceback (most recent call last)" /tmp/contributor-invalid-bundle.log; then
            echo "invalid bundle leaked a Python traceback" >&2
            exit 1
          fi

      - name: Corrupt local state fails cleanly
        working-directory: /tmp/ebus-evidence-contributor
        run: |
          cp data/evidence-state.json /tmp/contributor-valid-state.json
          printf '{"format":' > data/evidence-state.json
          if ./evidence status --raw /tmp/contributor-ebusd.raw             > /tmp/contributor-invalid-state.log 2>&1; then
            cat /tmp/contributor-invalid-state.log
            echo "status unexpectedly accepted a corrupt state file" >&2
            exit 1
          fi
          cat /tmp/contributor-invalid-state.log
          if grep -F "Traceback (most recent call last)" /tmp/contributor-invalid-state.log; then
            echo "corrupt local state leaked a Python traceback" >&2
            exit 1
          fi
          mv /tmp/contributor-valid-state.json data/evidence-state.json
          ./evidence status --raw /tmp/contributor-ebusd.raw

      - name: Fresh contributor checkout remains source-clean
        working-directory: /tmp/ebus-evidence-contributor
        run: test -z "$(git status --porcelain)"


  beginner-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Bootstrap install
        run: bash install.sh

      - name: Check launcher
        run: |
          ./evidence --version
          ./evidence --help

      - name: Reinstall reuses a healthy virtualenv
        run: |
          bash install.sh | tee /tmp/evidence-reinstall.log
          grep -F "Using existing virtual environment." /tmp/evidence-reinstall.log
          ./evidence --version

      - name: Broken recognized virtualenv is recreated without touching data
        run: |
          mkdir -p data
          printf 'keep-me\n' > data/install-preserve-marker
          rm .venv/bin/python
          bash install.sh | tee /tmp/evidence-recreate.log
          grep -F "Recreating the local virtual environment..." /tmp/evidence-recreate.log
          test -x .venv/bin/python
          grep -Fx "keep-me" data/install-preserve-marker
          ./evidence --version

      - name: Beginner workflow on synthetic raw log
        run: |
          cp tests/fixtures/sample.raw /tmp/ebusd-evidence-test.raw
          ./evidence doctor --raw /tmp/ebusd-evidence-test.raw --profile hw5103-open-evidence
          ./evidence collect --raw /tmp/ebusd-evidence-test.raw --seconds 0
          head -n 1 tests/fixtures/sample.raw >> /tmp/ebusd-evidence-test.raw
          ./evidence collect --raw /tmp/ebusd-evidence-test.raw --seconds 0
          ./evidence status --raw /tmp/ebusd-evidence-test.raw
          ./evidence export
          ./evidence verify data/evidence.zip
          ./evidence verify --submission data/evidence.zip

      - name: Static copied-file import workflow
        run: |
          rm -rf data
          cp tests/fixtures/sample.raw /tmp/ebusd-evidence-import.raw
          sha256sum /tmp/ebusd-evidence-import.raw > /tmp/ebusd-evidence-import.sha256
          ./evidence doctor --raw /tmp/ebusd-evidence-import.raw --profile hw5103-open-evidence
          ./evidence import --raw /tmp/ebusd-evidence-import.raw
          sha256sum -c /tmp/ebusd-evidence-import.sha256
          ./evidence status --raw /tmp/ebusd-evidence-import.raw
          ./evidence export
          ./evidence verify data/evidence.zip
          ./evidence verify --submission data/evidence.zip

      - name: Unknown .venv directory is never deleted automatically
        run: |
          rm -rf .venv
          mkdir .venv
          printf 'do-not-delete\n' > .venv/KEEP
          if bash install.sh > /tmp/evidence-unsafe-venv.log 2>&1; then
            cat /tmp/evidence-unsafe-venv.log
            echo "installer unexpectedly accepted an unknown .venv directory" >&2
            exit 1
          fi
          cat /tmp/evidence-unsafe-venv.log
          grep -F "does not look like a Python virtual environment" /tmp/evidence-unsafe-venv.log
          grep -Fx "do-not-delete" .venv/KEEP
          rm -rf .venv
          bash install.sh
          ./evidence --version

      - name: Bootstrap leaves checkout clean
        run: test -z "$(git status --porcelain)"
