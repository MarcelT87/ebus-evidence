name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        run: pytest -q


  beginner-flow:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.11"

      - name: Bootstrap install
        run: bash install.sh

      - name: Check launcher
        run: |
          ./evidence --version
          ./evidence --help

      - name: Reinstall reuses a healthy virtualenv
        run: |
          bash install.sh | tee /tmp/evidence-reinstall.log
          grep -F "Using existing virtual environment." /tmp/evidence-reinstall.log
          ./evidence --version

      - name: Broken recognized virtualenv is recreated without touching data
        run: |
          mkdir -p data
          printf 'keep-me\n' > data/install-preserve-marker
          rm .venv/bin/python
          bash install.sh | tee /tmp/evidence-recreate.log
          grep -F "Recreating the local virtual environment..." /tmp/evidence-recreate.log
          test -x .venv/bin/python
          grep -Fx "keep-me" data/install-preserve-marker
          ./evidence --version

      - name: Beginner workflow on synthetic raw log
        run: |
          cp tests/fixtures/sample.raw /tmp/ebusd-evidence-test.raw
          ./evidence doctor --raw /tmp/ebusd-evidence-test.raw --profile hw5103-open-evidence
          ./evidence collect --raw /tmp/ebusd-evidence-test.raw --seconds 0
          head -n 1 tests/fixtures/sample.raw >> /tmp/ebusd-evidence-test.raw
          ./evidence collect --raw /tmp/ebusd-evidence-test.raw --seconds 0
          ./evidence status --raw /tmp/ebusd-evidence-test.raw
          ./evidence export
          ./evidence verify data/evidence.zip
          ./evidence verify --submission data/evidence.zip

      - name: Static copied-file import workflow
        run: |
          rm -rf data
          cp tests/fixtures/sample.raw /tmp/ebusd-evidence-import.raw
          sha256sum /tmp/ebusd-evidence-import.raw > /tmp/ebusd-evidence-import.sha256
          ./evidence doctor --raw /tmp/ebusd-evidence-import.raw --profile hw5103-open-evidence
          ./evidence import --raw /tmp/ebusd-evidence-import.raw
          sha256sum -c /tmp/ebusd-evidence-import.sha256
          ./evidence status --raw /tmp/ebusd-evidence-import.raw
          ./evidence export
          ./evidence verify data/evidence.zip
          ./evidence verify --submission data/evidence.zip

      - name: Unknown .venv directory is never deleted automatically
        run: |
          rm -rf .venv
          mkdir .venv
          printf 'do-not-delete\n' > .venv/KEEP
          if bash install.sh > /tmp/evidence-unsafe-venv.log 2>&1; then
            cat /tmp/evidence-unsafe-venv.log
            echo "installer unexpectedly accepted an unknown .venv directory" >&2
            exit 1
          fi
          cat /tmp/evidence-unsafe-venv.log
          grep -F "does not look like a Python virtual environment" /tmp/evidence-unsafe-venv.log
          grep -Fx "do-not-delete" .venv/KEEP
          rm -rf .venv
          bash install.sh
          ./evidence --version

      - name: Bootstrap leaves checkout clean
        run: test -z "$(git status --porcelain)"
