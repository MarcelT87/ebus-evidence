name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Test
        run: pytest -q


  beginner-flow:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Bootstrap install
        run: bash install.sh

      - name: Check launcher
        run: |
          ./evidence --version
          ./evidence --help

      - name: Beginner workflow on synthetic raw log
        run: |
          ./evidence doctor --raw tests/fixtures/sample.raw --profile hw5103-open-evidence
          ./evidence collect --raw tests/fixtures/sample.raw --seconds 0.1
          ./evidence status --raw tests/fixtures/sample.raw
          ./evidence export
          ./evidence verify data/evidence.zip

      - name: Bootstrap leaves checkout clean
        run: test -z "$(git status --porcelain)"
